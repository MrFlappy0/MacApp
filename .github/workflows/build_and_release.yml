name: Build macOS DMG and Upload to Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach DMG to (example: v2.0.0)"
        required: false
        type: string
      xcode_workspace_path:
        description: "Optional override path to .xcworkspace"
        required: false
        type: string
      xcode_project_path:
        description: "Optional override path to .xcodeproj"
        required: false
        type: string
      xcode_scheme:
        description: "Optional override scheme name"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target release tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            echo "workflow_dispatch requires inputs.release_tag unless run from a tag ref" >&2
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Build app and create DMG
        id: dmg
        shell: bash
        env:
          TAG_NAME: ${{ steps.vars.outputs.release_tag }}
          XCODE_WORKSPACE_PATH: ${{ inputs.xcode_workspace_path }}
          XCODE_PROJECT_PATH: ${{ inputs.xcode_project_path }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
        run: |
          ./scripts/build_release_dmg.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.dmg_name }}
          path: ${{ steps.dmg.outputs.dmg_path }}

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          files: ${{ steps.dmg.outputs.dmg_path }}
