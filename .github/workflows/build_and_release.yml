name: Build and Release MLX for All

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build and Create DMG
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: actions/setup-xcode@v1
        with:
          xcode-version: '15.3'

      - name: Install dependencies
        run: |
          # Install create-dmg for better DMG layout
          brew install create-dmg
          
          # Install Python for icon generation (if needed)
          if ! command -v python3 &> /dev/null; then
              echo "Python not found, installing..."
              # Python is usually pre-installed on macOS runners
          fi

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=2.0.0" >> $GITHUB_OUTPUT
          fi
          echo "Building version: ${{ steps.version.outputs.VERSION }}"

      - name: Make build script executable
        run: |
          chmod +x build_release.sh
          chmod +x create_icon.icns.sh

      - name: Build application and create DMG
        run: |
          ./build_release.sh ${{ steps.version.outputs.VERSION }}

      - name: Verify DMG file
        run: |
          DMG_PATH="build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg"
          if [ -f "$DMG_PATH" ]; then
            echo "DMG file created successfully:"
            ls -lh "$DMG_PATH"
            
            # Verify it's a valid DMG
            if hdiutil verify "$DMG_PATH" &> /dev/null; then
              echo "✅ DMG is valid"
            else
              echo "⚠️ DMG verification failed"
            fi
          else
            echo "❌ DMG file not found"
            ls -la build/dmg/
            exit 1
          fi

      - name: Create checksum
        run: |
          DMG_PATH="build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg"
          if [ -f "$DMG_PATH" ]; then
            shasum -a 256 "$DMG_PATH" > "build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg.sha256"
            cat "build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg.sha256"
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLXForAll-${{ steps.version.outputs.VERSION }}.dmg
          path: build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg
          retention-days: 7

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLXForAll-${{ steps.version.outputs.VERSION }}.dmg.sha256
          path: build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg.sha256
          retention-days: 7

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg
            build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg.sha256
          name: MLX for All v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🎉 Nouvelle Version : v${{ steps.version.outputs.VERSION }}
            
            **MLX for All** - L'application IA ultime pour macOS, optimisée pour Apple Silicon (M1/M2/M3/M5)
            
            ### 📦 Changements
            - ✅ **MLX for All 2.0.0** : Refonte complète de l'application
            - ✅ Support des derniers modèles 2026 (MLX 2.0, Apple M5, Mistral Large, etc.)
            - ✅ Interface moderne similaire à ChatGPT
            - ✅ Gestion complète des modèles (téléchargement, chargement, configuration)
            - ✅ Intégration MCP pour étendre les capacités de l'IA
            - ✅ **TOUT centralisé dans les paramètres** pour une configuration facile
            - ✅ Optimisation pour Apple Silicon avec accélération Metal
            
            ### 💻 Configuration Requise
            - **Système d'exploitation** : macOS 14.0+ (Sonoma ou ultérieur)
            - **Architecture** : Apple Silicon (M1, M2, M3, M5) **recommandé**
            - **RAM** : 8 Go minimum (16 Go recommandé pour les grands modèles)
            - **Stockage** : 10 Go d'espace libre (pour les modèles)
            
            ### 📥 Téléchargement
            - **DMG pour macOS 14.0+** (Apple Silicon recommandé)
            - **Taille** : ~$(du -sh build/dmg/MLXForAll-${{ steps.version.outputs.VERSION }}.dmg 2>/dev/null | cut -f1 || echo "variable")
            
            ### 🔧 Installation
            1. **Télécharger** le fichier `.dmg` ci-dessus
            2. **Ouvrir** le fichier `.dmg`
            3. **Glisser-déposer** **MLX for All** dans le dossier `/Applications`
            4. **Lancer** l'application depuis `/Applications`
            
            > ⚠️ **Sécurité macOS** : Si l'application ne s'ouvre pas, faites un **clic droit > Ouvrir** ou autorisez-la dans **Préférences Système > Sécurité et confidentialité**.
            
            ### ✨ Fonctionnalités Principales
            
            #### 💬 Chat Avancé
            - Interface moderne inspirée de ChatGPT
            - Historique des conversations avec persistance
            - Streaming des réponses (affichage progressif)
            - Support des pièces jointes (PDF, texte, images)
            - Messages système personnalisables
            
            #### 🧠 Gestion des Modèles 2026
            - **Modèles intégrés** : Mistral Large 2026, Apple M5 LLM, MLX Hermes 2, Phi-3, Tiny Llama, Gemma 2
            - **Téléchargement automatique** depuis Hugging Face
            - **Chargement/déchargement** pour gérer la mémoire
            - **Configuration avancée** : Température, Top P/K, Beam Search, etc.
            - **Support MLX 2.0** avec accélération Metal
            
            #### 🔧 MCP (Model Context Protocol)
            **TOUS les outils sont configurables dans l'application** :
            - 🌐 **Outils Web** : Recherche web, récupération de contenu
            - 📁 **Outils de Fichiers** : Lecture/écriture, liste des fichiers
            - ⚙️ **Outils Système** : Date/heure, calculatrice
            - 💻 **Outils de Code** : Exécution Python, Swift
            
            #### ⚡ Performances Optimisées
            - **Accélération Metal (MPS)** pour les meilleurs performances
            - **Gestion mémoire intelligente** avec déchargement automatique
            - **Précision configurable** : Float32, Float16, Int8
            - **Batch processing** pour une meilleure efficacité
            - **Streaming optimisé** : Génération token par token
            
            ### 📊 Checksum
            Le fichier SHA256 est disponible pour vérifier l'intégrité du téléchargement.
            
            ### 🤝 Contribuer
            Les contributions sont les bienvenues ! Voir [CONTRIBUTING.md](https://github.com/MrFlappy0/MacApp/blob/main/CONTRIBUTING.md)
            
            ### 📜 Licence
            MIT License - Copyright © 2026 MrFlappy0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notification
  notify:
    name: Notify on Success
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          echo "✅ Build and DMG creation completed successfully!"
          echo "Version: ${{ needs.build.outputs.version || steps.version.outputs.VERSION }}"
          echo "DMG available in artifacts and release (if tagged)"
